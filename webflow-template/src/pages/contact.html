<!--{"title": "Contact – Hanabi Sushi & Robata", "desc": "Address, opening hours and contact form.", "nav": "contact"}-->
<main>
  <section class="page-header">
    <div class="container page-header-grid">
      <div class="stack-m">
        <div class="eyebrow"><span class="eyebrow-line"></span>Contact</div>
        <h1 class="h1">Say <span class="h-italic">hello</span></h1>
      </div>
      <p class="lead">Private dining, gift cards, press or just a question about the menu — we read every message.</p>
    </div>
  </section>
  <section class="section no-top">
    <div class="container reserve-grid">
      <form class="form" onsubmit="return false">
        <div class="form-field"><label class="form-label" for="c-name">Name</label><input class="input is-light" id="c-name" type="text" placeholder="Jane Doe" required></div>
        <div class="form-field"><label class="form-label" for="c-email">Email</label><input class="input is-light" id="c-email" type="email" placeholder="jane@email.com" required></div>
        <div class="form-field is-full"><label class="form-label" for="c-topic">Topic</label><select class="input is-light" id="c-topic"><option>General question</option><option>Private dining</option><option>Gift cards</option><option>Press</option></select></div>
        <div class="form-field is-full"><label class="form-label" for="c-msg">Message</label><textarea class="input is-light is-area" id="c-msg" placeholder="Tell us a little more…"></textarea></div>
        <div class="form-field is-full"><button class="button" type="submit">Send message <span class="button-arrow">→</span></button></div>
      </form>
      <div class="info-card">
        <div class="info-row"><span class="info-label">Address</span><span class="info-value">48 Harbor Lane<br>Seaside City, 10001</span></div>
        <div class="info-row"><span class="info-label">Phone</span><a href="tel:+15550142048" class="info-value">+1 (555) 014-2048</a></div>
        <div class="info-row"><span class="info-label">Email</span><a href="mailto:hello@hanabi.example" class="info-value">hello@hanabi.example</a></div>
        <a href="#" class="button is-ghost-light">Get directions</a>
      </div>
    </div>
  </section>
  <div class="container is-wide"><div class="page-header-image"><img class="cover-image" src="{{img:contact}}" alt="Hanabi entrance at night" loading="lazy"></div></div>
  <div class="section is-tight"></div>
</main>
